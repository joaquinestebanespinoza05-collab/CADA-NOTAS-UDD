<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso - Universidad del Desarrollo</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --udd-blue: #005b96;
  --udd-btn-blue: #004b85;
  --udd-btn-hover: #003763;
  --link: #0b5394;
  --blue: #0a4a8a;
  --red: #d63b0c;
  --orange: #d97006;
  --green: #2f9a2f;
  --line: #dfe3e8;
  --txt: #6b6f75;
  --bg-login: #e9e9e9;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: "Open Sans", Arial, sans-serif; color: var(--txt); background-color: var(--bg-login); }

/* PANTALLA DE LOGIN */
#login-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
  background-color: var(--bg-login);
}
.login-header {
  text-align: center;
  margin-bottom: 24px;
}
.login-logo-img {
  max-width: 280px;
  height: auto;
  display: block;
  margin: 0 auto 10px auto;
}
.login-card {
  background: #ffffff;
  width: 100%;
  max-width: 440px;
  border-radius: 4px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
  overflow: hidden;
  border-top: 5px solid var(--udd-blue);
}
.login-card-body {
  padding: 35px 30px 30px 30px;
  text-align: center;
}
.login-title {
  color: var(--udd-blue);
  font-size: 1.25rem;
  font-weight: 700;
  margin: 0 0 25px 0;
  line-height: 1.4;
}
.form-group {
  margin-bottom: 16px;
  text-align: left;
}
.form-control {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #ccd0d5;
  border-radius: 4px;
  font-size: 0.95rem;
  color: #333;
  background-color: #fff;
  outline: none;
  transition: border-color 0.2s;
}
.form-control:focus {
  border-color: var(--udd-blue);
  box-shadow: 0 0 0 2px rgba(0,91,150,0.15);
}
.btn-login {
  width: 100%;
  padding: 12px;
  background-color: var(--udd-btn-blue);
  color: #fff;
  border: none;
  border-radius: 4px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  margin-top: 10px;
  transition: background-color 0.2s;
}
.btn-login:hover {
  background-color: var(--udd-btn-hover);
}
.login-footer-card {
  background-color: #f5f6f7;
  padding: 15px;
  border-top: 1px solid #e4e7eb;
  text-align: center;
  font-size: 0.9rem;
}
.login-footer-card a {
  color: #333;
  text-decoration: none;
}
.login-footer-card a:hover {
  text-decoration: underline;
}
.login-error {
  color: var(--red);
  font-size: 0.85rem;
  margin-bottom: 12px;
  display: none;
}

/* PORTAL DE NOTAS */
#portal-container {
  display: none;
  background: #fff;
  min-height: 100vh;
}
main { max-width: 1100px; margin: 0 auto; padding: 20px 18px 60px; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 0 12px; font-family: "Plus Jakarta Sans","Open Sans",Arial,sans-serif; border-bottom: 1px solid var(--line); }
.tabs { display: inline-flex; border: 1px solid #d9dde3; border-radius: 14px; overflow: hidden; background: #fff; }
.tab { padding: 11px 18px; font: 500 1rem "Plus Jakarta Sans","Open Sans",Arial,sans-serif; color: #6b7280; background: #fff; border: 0; cursor: pointer; }
.tab+.tab { border-left: 1px solid #d9dde3; }
.tab.active { background: #f1f3f6; color: #2d3748; }
.logout { color: #6b7280; text-decoration: none; font-size: 1rem; font-weight: 500; cursor: pointer; }
.logout:hover { color: #2d3748; }
.career { padding: 12px 0 22px; }
.career a { display: inline-block; padding: 10px 18px; border: 1px solid var(--orange); border-radius: 8px; color: var(--orange); text-decoration: none; font: 500 1rem "Plus Jakarta Sans","Open Sans",Arial,sans-serif; background: #fff; }
.career a:hover { background: #fff6ec; }

.course { border: 1px solid var(--line); border-radius: 4px; margin-bottom: 4px; background: #fff; }
.chead { padding: 20px 46px; color: var(--link); text-transform: uppercase; cursor: pointer; font-size: 1.05rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.course.open .chead { border-bottom: 1px solid var(--line); }
.badge { display: inline-block; color: #fff; font-size: 0.78rem; font-weight: 700; border-radius: 6px; padding: 3px 8px; line-height: 1.3; text-transform: none; }
.badge.ok { background: var(--blue); } .badge.bad { background: var(--red); }
.cbody { padding: 22px 24px 26px; }
.row { display: flex; align-items: center; justify-content: space-between; min-height: 56px; }
.row.tog { cursor: pointer; }
.tri { display: inline-block; width: 22px; color: #888; font-size: 0.85rem; }
.cat { background: var(--orange); color: #fff; font-weight: 700; font-size: 0.78rem; text-transform: uppercase; border-radius: 8px; padding: 8px 8px; line-height: 1.1; }
.name { text-transform: none; }
.g { background: var(--green); color: #fff; font-weight: 700; font-size: 0.8rem; border-radius: 7px; padding: 5px 9px; min-width: 52px; text-align: center; }
.g.bad { background: var(--red); }
.g.edit, .badge.edit { cursor: pointer; }
.g.edit:hover, .badge.edit:hover { outline: 2px solid #9bb8dc; }
.empty { padding: 6px 0 6px 6px; font-size: 0.92rem; }

/* MODAL DE EDICIÓN */
#modal-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;
}
.modal-box {
  background: #fff; padding: 24px; border-radius: 8px; width: 90%; max-width: 320px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15); text-align: center;
}
.modal-box h3 { margin: 0 0 12px; font-size: 1.1rem; color: #333; }
.modal-box input {
  width: 100%; padding: 10px; font-size: 1rem; border: 1px solid #ccd0d5; border-radius: 4px; margin-bottom: 16px; text-align: center;
}
.modal-buttons { display: flex; gap: 10px; justify-content: center; }
.modal-buttons button {
  padding: 8px 16px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 0.9rem;
}
.btn-save { background: var(--udd-btn-blue); color: #fff; }
.btn-cancel { background: #e4e7eb; color: #333; }
</style>
</head>
<body>

<!-- PANTALLA DE LOGIN -->
<div id="login-container">
  <div class="login-header">
    <img src="image_979afb.png" class="login-logo-img" alt="Universidad del Desarrollo" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 300 80\'><text x=\'50%\' y=\'40\' font-family=\'Arial\' font-weight=\'bold\' font-size=\'32\' fill=\'%23005b96\' text-anchor=\'middle\'>UDD</text><text x=\'50%\' y=\'70\' font-family=\'Arial\' font-size=\'16\' fill=\'%23333\' text-anchor=\'middle\'>Universidad del Desarrollo</text></svg>';">
  </div>
  <div class="login-card">
    <div class="login-card-body">
      <h2 class="login-title">Accede a tu cuenta en<br>Universidad del Desarrollo</h2>
      <div id="loginError" class="login-error">Usuario o contraseña incorrectos</div>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <input type="text" id="username" class="form-control" placeholder="Usuario" required autocomplete="username">
        </div>
        <div class="form-group">
          <input type="password" id="password" class="form-control" placeholder="Contraseña" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-login">Acceder</button>
      </form>
    </div>
    <div class="login-footer-card">
      <a href="#" onclick="alert('Por favor contacte al administrador o soporte de la UDD para recuperar sus datos.'); return false;">¿Olvidaste tu usuario o contraseña?</a>
    </div>
  </div>
</div>

<!-- PORTAL DE NOTAS -->
<div id="portal-container">
  <main>
    <div class="topbar">
      <div class="tabs">
        <button class="tab" type="button">Inicio</button>
        <button class="tab active" type="button">Kinesiología</button>
      </div>
      <a class="logout" onclick="handleLogout()">Cerrar sesión</a>
    </div>
    <div class="career"><a href="https://udd.instructure.com/" target="_blank">Ver carrera</a></div>
    <div id="root"></div>
  </main>
</div>

<!-- MODAL PERSONALIZADO DE EDICIÓN -->
<div id="modal-overlay">
  <div class="modal-box">
    <h3 id="modal-title">Modificar Nota</h3>
    <input type="text" id="modal-input" placeholder="Ej. 6.0 o deja vacío">
    <div class="modal-buttons">
      <button class="btn-save" onclick="saveModalValue()">Guardar</button>
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
const COURSES=[
 {n:"Taller de comunicación oral",groups:[
   {n:"Asistencia",items:[{n:"ASISTENCIA",w:80,g:100,pct:true}]},
   {n:"Nota final",items:[
     {n:"CERTAMEN APERTURABLE",w:40,g:6.8},
     {n:"talleres",w:60,items:[
       {n:"TALLERES 1: STORYTELLING",w:33,g:5.2},
       {n:"TALLERES 3: BITÁCORA",w:34,g:5.0},
       {n:"TALLERES 2: MESA REDONDA",w:33,g:7.0}]}]}]},
 {n:"Morfología",groups:[
   {n:"Nota final",items:[
     {n:"talleres",w:100,items:[
       {n:"TAREAS",g:6.3},
       {n:"CERTAMEN 3",g:5.5},
       {n:"CERTAMEN 1",g:4.0},
       {n:"CERTAMEN 2",g:5.0},
       {n:"CONTROLES",g:5.0},
       {n:"INFORMES",g:6.0},
       {n:"TAREAS",g:6.0}]}]}]},
 {n:"Taller comunicación escrita",groups:[
   {n:"Nota final",items:[
     {n:"talleres",w:100,items:[
       {n:"TALLERES 1",g:6.8},
       {n:"TALLERES 2",g:6.6},
       {n:"TALLERES 3",g:7.0},
       {n:"TALLERES 4",g:5.0}]}]}]},
 {n:"Biofísica",groups:[
   {n:"Asistencia",items:[{n:"ASISTENCIA",w:100,g:100,pct:true}]},
   {n:"PRESENTACION EXAMEN",items:[
     {n:"CERTAMEN 1",w:20,g:4.0},
     {n:"TAREAS",w:10,items:[
       {n:"TAREA 4",g:4.2},
       {n:"TAREA 6",g:7.0},
       {n:"TAREA 8",g:7.0},
       {n:"TAREA 1",g:7.0},
       {n:"TAREA 2",g:6.0},
       {n:"TAREA 3",g:6.1}
     ]}
   ]}
 ]},
 {n:"Actividad física y deporte",groups:[
   {n:"Nota final",items:[
     {n:"talleres",w:100,items:[
       {n:"TALLERES 1",g:6.8},
       {n:"TALLERES 2",g:6.8},
       {n:"TALLERES 3",g:5.6}]}]}]},
 {n:"Práctica kinésica básica",groups:[
   {n:"Nota final",items:[
     {n:"talleres",w:100,items:[
       {n:"CERTAMEN 1",g:6.8},
       {n:"CERTAMEN 2",g:6.6},
       {n:"TAREAS",g:5.0},
       {n:"PROYECTOS",g:6.1}]}]}]},
 {n:"Lectura crítica",groups:[
   {n:"Asistencia",items:[{n:"ASISTENCIA",w:80,g:100,pct:true}]},
   {n:"Nota final",items:[
     {n:"CERTAMEN APERTURABLE",w:40,g:6.2},
     {n:"talleres",w:60,items:[
       {n:"TALLERES 2",w:33,g:6.5},
       {n:"TALLERES 3",w:34,g:6.4},
       {n:"TALLERES 1",w:33,g:6.5}]}]}]},
 {n:"Morfología II",groups:[]},
 {n:"Bases químicas y biológicas",groups:[]},
 {n:"Biofísica II",groups:[
   {n:"Asistencia",items:[{n:"ASISTENCIA",w:100,g:100,pct:true}]},
   {n:"PRESENTACION EXAMEN",items:[
     {n:"CERTAMEN 1",w:20,g:4.0},
     {n:"TAREAS",w:10,items:[
       {n:"TAREA 4",g:4.2},
       {n:"TAREA 6",g:7.0},
       {n:"TAREA 8",g:7.0},
       {n:"TAREA 1",g:7.0},
       {n:"TAREA 2",g:6.0},
       {n:"TAREA 3",g:6.1}
     ]}
   ]}
 ]},
 {n:"Lectura crítica II",groups:[]}
];

const KEY='notas-parciales-v2';
let ov={},open=new Set();
try{ov=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ov))}catch(e){}};
const fmt=n=>n.toFixed(1).replace('.',',');

function leaf(it,k){return ov[k]!==undefined?ov[k]:(it.g!==undefined?it.g:null)}
function val(it,k){return it.items?avg(it.items,k):leaf(it,k)}
function avg(items,k){let s=0,w=0;items.forEach((it,i)=>{const v=val(it,k+'.'+i);if(v!=null){const x=it.w??1;s+=v*x;w+=x}});return w?Math.round(s/w*10+1e-9)/10:null}
function final(c,ci){
  const gi=c.groups.findIndex(g=>g.n.toUpperCase()==='NOTA FINAL');
  if(gi>=0)return avg(c.groups[gi].items,ci+'.'+gi);
  return ov['f'+ci]!==undefined?ov['f'+ci]:(c.final!==undefined?c.final:null);
}

function items(list,k,depth){
  return list.map((it,i)=>{
    const key=k+'.'+i,pad=`style="padding-left:${6+depth*28}px"`;
    const v=val(it,key),bad=v!=null&&!it.pct&&v<4;
    const badge=v==null?`<span class="g edit" data-edit="${key}">–</span>`
      :`<span class="g ${bad?'bad':''} ${it.items?'':'edit'}" ${it.items?'':`data-edit="${key}"`}>${fmt(v)}</span>`;
    const label=it.w!==undefined?`${it.n} (${fmt(it.w)}%)`.replace(',0%','%'):it.n;
    if(it.items){
      const o=open.has(key);
      return `<div class="row tog" ${pad} data-tog="${key}"><span><span class="tri">${o?'▼':'▶'}</span><span class="name">${label}</span></span>${badge}</div>`+(o?items(it.items,key,depth+1):'');
    }
    return `<div class="row" ${pad}><span class="name">${label}</span>${badge}</div>`;
  }).join('');
}

function render(){
  document.getElementById('root').innerHTML=COURSES.map((c,ci)=>{
    const o=open.has('c'+ci),f=final(c,ci);
    const hasDetail=c.groups.length>0;
    const badge=f!=null?`<span class="badge ${f<4?'bad':'ok'} ${hasDetail?'':'edit'}" ${hasDetail?'':`data-edit="f${ci}"`}>Nota final: ${fmt(f)}</span>`:'';
    let body='';
    if(o){
      body='<div class="cbody">'+(hasDetail?c.groups.map((g,gi)=>{
        const key=ci+'.'+gi,go=open.has('g'+key);
        return `<div class="row tog" data-tog="g${key}" style="justify-content:flex-start"><span class="tri">${go?'▼':'▶'}</span><span class="cat">${g.n}</span></div>`+(go?items(g.items,key,1):'');
      }).join(''):'<p class="empty">Aún no hay detalle para este ramo.</p>')+'</div>';
    }
    return `<section class="course ${o?'open':''}"><div class="chead" data-tog="c${ci}">${c.n} ${badge}</div>${body}</section>`;
  }).join('');
}

// CONTROL DE LOGIN
function handleLogin(e) {
  e.preventDefault();
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  if(u === 'j.espinozab' && p === '12345o') {
    document.getElementById('login-container').style.display = 'none';
    document.getElementById('portal-container').style.display = 'block';
    render();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}

function handleLogout() {
  document.getElementById('portal-container').style.display = 'none';
  document.getElementById('login-container').style.display = 'flex';
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
  document.getElementById('loginError').style.display = 'none';
}

// MODAL DE EDICIÓN
let activeKey = null;
function openModal(key, currentVal) {
  activeKey = key;
  document.getElementById('modal-input').value = currentVal !== undefined && currentVal !== null ? currentVal : '';
  document.getElementById('modal-overlay').style.display = 'flex';
  document.getElementById('modal-input').focus();
}
function closeModal() {
  document.getElementById('modal-overlay').style.display = 'none';
  activeKey = null;
}
function saveModalValue() {
  if(!activeKey) return;
  const r = document.getElementById('modal-input').value;
  const n = parseFloat(r.replace(',','.'));
  if(r.trim() === '' || isNaN(n)) {
    delete ov[activeKey];
  } else {
    ov[activeKey] = n;
  }
  save();
  closeModal();
  render();
}

document.getElementById('root').addEventListener('click', e => {
  const ed = e.target.closest('[data-edit]');
  if(ed) {
    e.stopPropagation();
    const k = ed.dataset.edit;
    openModal(k, ov[k]);
    return;
  }
  const t = e.target.closest('[data-tog]');
  if(t) {
    const k = t.dataset.tog;
    open.has(k) ? open.delete(k) : open.add(k);
    render();
  }
});
</script>
</body>
</html>
